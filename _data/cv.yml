- title: Advising and Teaching Innovation
  type: list
  contents:
    - Co-supervisor of Adrián Ghajari Espinosa's PhD at UNED, with Víctor Fresno (since September 2024).
    - Co-supervisor of Adrián Ghajari Espinosa's MSc thesis on semantic similarity in Spanish song lyrics (UNED, September 2024).
    - Co-supervisor of David Eduardo Delgado Camacho's MSc thesis on a framework and visual analytics tool for exploring compositionality in sentence embeddings (UNED, June 2025).
    - Director of UNED Summer Course 2024 on conversational AI (20 hours).
    - Principal Investigator, teaching innovation project on online Python learning architecture (University of Salamanca, 2017-2018).
    - Member, Innovation Group "Intelligent Systems for Learning" (UNED, since 2024).

